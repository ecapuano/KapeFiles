name: KAPE Target Validation (Windows)

# Lives on the kape-ci branch. Dispatch it against any branch of this fork to
# parse the Targets with real kape.exe and run a live collection against fixtures.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or ref containing the Targets to validate
        required: true
        default: ai-coding-agents
      targets:
        description: KAPE --target value (comma separated Target names)
        required: true
        default: AICodingAgents
      fixture_tkapes:
        description: Space separated .tkape paths (relative to repo) used to plant fixture files
        required: true
        default: Targets/Apps/ClaudeCode.tkape Targets/Apps/OpenAICodex.tkape Targets/Apps/GitHubCopilot.tkape Targets/Apps/GeminiCLI.tkape Targets/Apps/OpenCode.tkape Targets/Apps/Cursor.tkape Targets/Apps/Cline.tkape Targets/Apps/RooCode.tkape

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout CI tooling (this branch)
        uses: actions/checkout@v4
        with:
          path: ci-tools

      - name: Checkout Targets under test
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          path: repo

      - name: Record tested commit
        shell: pwsh
        run: |
          $sha = git -C repo rev-parse HEAD
          $subject = git -C repo log -1 --pretty=%s
          "TESTED_SHA=$sha" | Out-File $env:GITHUB_ENV -Append
          "TESTED_SUBJECT=$subject" | Out-File $env:GITHUB_ENV -Append
          "Testing ${{ inputs.ref }} @ $sha  ($subject)"
          New-Item -ItemType Directory C:\results -Force | Out-Null
          "ref=${{ inputs.ref }}`nsha=$sha`nsubject=$subject`ntargets=${{ inputs.targets }}`nfixtures=${{ inputs.fixture_tkapes }}" | Out-File C:\results\tested-commit.txt

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install pyyaml

      - name: Download KAPE from the official updater endpoint
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://s3.amazonaws.com/cyb-us-prd-kape/kape.zip -OutFile kape.zip
          Expand-Archive kape.zip -DestinationPath C:\kape-dist
          $exe = Get-ChildItem C:\kape-dist -Recurse -Filter kape.exe | Select-Object -First 1
          "KAPE_DIR=$($exe.DirectoryName)" | Out-File $env:GITHUB_ENV -Append
          & $exe.FullName --version 2>&1 | Select-Object -First 3 | Tee-Object C:\results\kape-version.txt

      - name: Replace shipped Targets/Modules with the branch under test
        shell: pwsh
        run: |
          Remove-Item "$env:KAPE_DIR\Targets" -Recurse -Force
          Remove-Item "$env:KAPE_DIR\Modules" -Recurse -Force
          Copy-Item repo\Targets "$env:KAPE_DIR\Targets" -Recurse
          Copy-Item repo\Modules "$env:KAPE_DIR\Modules" -Recurse
          Get-ChildItem $env:KAPE_DIR | Select-Object Name, Length
          if (-not (Test-Path "$env:KAPE_DIR\Targets\Compound")) { Write-Error "Targets copy failed"; exit 1 }
          "Targets copied: $((Get-ChildItem "$env:KAPE_DIR\Targets" -Recurse -Filter *.tkape).Count) tkape files"

      - name: kape.exe --tlist (parse every Target)
        shell: pwsh
        run: |
          & "$env:KAPE_DIR\kape.exe" --tlist "$env:KAPE_DIR\Targets" 2>&1 | Tee-Object C:\results\tlist.txt
          & "$env:KAPE_DIR\kape.exe" --tlist "$env:KAPE_DIR\Targets" --tdetail 2>&1 | Out-File C:\results\tlist-detail.txt
          $names = "${{ inputs.targets }}".Split(',') | ForEach-Object { $_.Trim() }
          $out = Get-Content C:\results\tlist.txt -Raw
          foreach ($n in $names) {
            if ($out -notmatch [regex]::Escape($n)) { Write-Error "Target '$n' not listed by kape.exe --tlist"; exit 1 }
            Write-Host "OK: $n listed"
          }
          if ($out -match '(?im)^\s*(error|exception|unhandled)') { Write-Warning "kape.exe reported errors while loading Targets - see tlist.txt" }

      - name: Plant fixture files
        shell: pwsh
        run: |
          $tk = "${{ inputs.fixture_tkapes }}".Split(' ') | ForEach-Object { "repo\$_" }
          python ci-tools\ci\kape_fixtures.py @tk --root C:\ --user testuser --manifest C:\results\manifest.json `
            --decoy 'C:\Users\%user%\.claude\.credentials.json' `
            --decoy 'C:\Users\%user%\.codex\auth.json' `
            --decoy 'C:\Users\%user%\.claude\sessions\1234.abcd.key' `
            --decoy 'C:\Users\%user%\.claude\plugins\cache\somePlugin\index.js' `
            --decoy 'C:\Users\%user%\.codex\cache\somePlugin\index.js' `
            --decoy 'C:\Users\%user%\.gemini\oauth_creds.json' `
            --decoy 'C:\Users\%user%\.local\share\opencode\auth.json' `
            --decoy 'C:\Users\%user%\.copilot\mcp-secrets\token.json' `
            --decoy 'C:\Users\%user%\.cline\data\secrets.json' `
            --decoy 'C:\Users\%user%\.cursor\projects\proj\canvases\node_modules\x\index.js'

      - name: Live collection with kape.exe
        shell: pwsh
        run: |
          & "$env:KAPE_DIR\kape.exe" --tsource C: --tdest C:\kout --target "${{ inputs.targets }}" --tflush 2>&1 | Tee-Object C:\results\collection.txt
          Copy-Item C:\kout\*ConsoleLog*,C:\kout\*CopyLog*,C:\kout\*SkipLog* C:\results\ -ErrorAction SilentlyContinue
          Get-ChildItem C:\kout -Recurse -File | ForEach-Object { $_.FullName } | Out-File C:\results\kout-tree.txt

      - name: Verify collected files against manifest
        shell: pwsh
        run: |
          python ci-tools\ci\kape_verify.py --manifest C:\results\manifest.json --tdest C:\kout 2>&1 | Tee-Object C:\results\verify.txt
          exit $LASTEXITCODE

      - name: Observe what real Windows installs of Claude Code and Codex create
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          npm install -g @anthropic-ai/claude-code @openai/codex 2>&1 | Select-Object -Last 3
          claude --version
          codex --version
          "== %USERPROFILE% = $env:USERPROFILE ==" | Tee-Object C:\results\real-install-observation.txt
          Get-ChildItem $env:USERPROFILE -Force -Filter '.claude*' | ForEach-Object { $_.FullName } | Tee-Object C:\results\real-install-observation.txt -Append
          Get-ChildItem $env:USERPROFILE -Force -Filter '.codex*' | ForEach-Object { $_.FullName } | Tee-Object C:\results\real-install-observation.txt -Append
          Get-ChildItem "$env:USERPROFILE\.claude","$env:USERPROFILE\.codex" -Recurse -Force -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName } | Tee-Object C:\results\real-install-observation.txt -Append

      - name: Write job summary
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $kv = (Get-Content C:\results\kape-version.txt -ErrorAction SilentlyContinue | Where-Object { $_ -match 'KAPE version' }) -join ''
          $found = (Select-String -Path C:\results\collection.txt -Pattern 'Found \d+ files|Copied \d+ out of \d+' -ErrorAction SilentlyContinue | ForEach-Object { $_.Line.Trim() }) -join '; '
          $verdict = (Select-String -Path C:\results\verify.txt -Pattern '^summary:' -ErrorAction SilentlyContinue | ForEach-Object { $_.Line }) -join ''
          $names = "${{ inputs.targets }}".Split(',') | ForEach-Object { $_.Trim() }
          $listed = foreach ($n in $names) { if (Select-String -Path C:\results\tlist.txt -Pattern "^Target: $([regex]::Escape($n)) " -Quiet) { "- ``$n``: listed by ``kape.exe --tlist``" } else { "- ``$n``: NOT LISTED" } }
          $total = (Select-String -Path C:\results\tlist.txt -Pattern '^Target: ' -ErrorAction SilentlyContinue | Measure-Object).Count
          $decoys = (Get-Content C:\results\manifest.json -Raw | ConvertFrom-Json).decoys | ForEach-Object { "- ``$($_.win)``" }
          @"
          # KAPE Target Validation

          | | |
          |---|---|
          | Tested ref | ``${{ inputs.ref }}`` |
          | Tested commit | ``$env:TESTED_SHA`` $env:TESTED_SUBJECT |
          | Targets under test | ``${{ inputs.targets }}`` |
          | Fixture sources | ``${{ inputs.fixture_tkapes }}`` |
          | KAPE | $kv (downloaded from Kroll's public updater endpoint) |
          | Runner | $env:RUNNER_OS, $([System.Environment]::OSVersion.VersionString) |

          ## Method
          1. The branch's ``Targets\`` and ``Modules\`` replace the ones shipped with KAPE, then ``kape.exe --tlist`` parses every Target ($total Targets loaded).
          2. ``ci/kape_fixtures.py`` reads each fixture .tkape and plants files matching every ``Path`` + ``FileMask`` (two name variants per mask, plus a nested file for ``Recursive`` entries) under ``C:\Users\testuser\``, with unique content so KAPE's SHA1 de-duplication cannot mask a miss.
          3. Decoy files that must **not** be collected are planted alongside (credentials, session keys, plugin caches).
          4. ``kape.exe --tsource C: --tdest C:\kout --target ${{ inputs.targets }}`` runs a live collection.
          5. ``ci/kape_verify.py`` checks every planted file exists under ``C:\kout`` and no decoy does.

          ## Parse check
          $($listed -join "`n")

          ## Collection
          $found

          ## Verdict
          **$verdict**

          ### Decoys (must not be collected)
          $($decoys -join "`n")

          <details><summary>Per-entry results (verify.txt)</summary>

          ``````
          $(Get-Content C:\results\verify.txt -Raw -ErrorAction SilentlyContinue)
          ``````
          </details>
          "@ | Out-File $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kape-validation-${{ inputs.ref }}
          path: C:\results
          retention-days: 90
