name: Coding Agent Artifact Probe (Windows)

# Installs coding-agent CLIs / extensions on a clean Windows runner and records
# exactly which files and directories each one creates under the user profile.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Snapshot helper
        shell: pwsh
        run: |
          New-Item -ItemType Directory C:\probe | Out-Null
          @'
          function Snap($tag) {
            $roots = @($env:USERPROFILE, $env:APPDATA, $env:LOCALAPPDATA, "$env:LOCALAPPDATA\Programs")
            $roots | ForEach-Object { Get-ChildItem $_ -Force -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName } } |
              Sort-Object -Unique | Out-File "C:\probe\snap-$tag.txt"
          }
          function RunTimed($cmdline, $seconds) {
            "-> $cmdline" | Tee-Object C:\probe\report.txt -Append
            $j = Start-Job -ScriptBlock { param($c) cmd /c "$c < NUL 2>&1" } -ArgumentList $cmdline
            $done = Wait-Job $j -Timeout $seconds
            if (-not $done) { Stop-Job $j; "   (timed out after ${seconds}s, killed)" | Tee-Object C:\probe\report.txt -Append }
            Receive-Job $j -ErrorAction SilentlyContinue | Select-Object -First 8 | Tee-Object C:\probe\report.txt -Append
            Remove-Job $j -Force -ErrorAction SilentlyContinue
            Get-Process node,bun,copilot,gemini,opencode -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
          function Diff($a, $b, $label) {
            $new = Compare-Object (Get-Content "C:\probe\snap-$a.txt") (Get-Content "C:\probe\snap-$b.txt") |
              Where-Object SideIndicator -eq '=>' | Select-Object -ExpandProperty InputObject
            "===== NEW top-level entries after: $label =====" | Tee-Object C:\probe\report.txt -Append
            $new | Tee-Object C:\probe\report.txt -Append
            foreach ($p in $new) {
              if (Test-Path $p -PathType Container) {
                "----- tree of $p (depth<=5, excluding node_modules/pkg) -----" | Tee-Object C:\probe\report.txt -Append
                Get-ChildItem $p -Recurse -Force -Depth 5 -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName -notmatch '\\node_modules\\|\\pkg\\' } |
                  ForEach-Object { $_.FullName } | Tee-Object C:\probe\report.txt -Append
              }
            }
          }
          '@ | Out-File C:\probe\helpers.ps1
          . C:\probe\helpers.ps1
          Snap base
          "USERPROFILE=$env:USERPROFILE  APPDATA=$env:APPDATA  LOCALAPPDATA=$env:LOCALAPPDATA" | Tee-Object C:\probe\report.txt

      - name: GitHub Copilot CLI
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'; $PSNativeCommandUseErrorActionPreference = $false
          . C:\probe\helpers.ps1
          try {
            npm install -g @github/copilot 2>&1 | Select-Object -Last 2
            where.exe copilot | Tee-Object C:\probe\report.txt -Append
            RunTimed 'copilot --version' 30
            RunTimed 'copilot -p hello' 40
          } finally { Snap copilot }

      - name: Gemini CLI
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'; $PSNativeCommandUseErrorActionPreference = $false
          . C:\probe\helpers.ps1
          try {
            npm install -g @google/gemini-cli 2>&1 | Select-Object -Last 2
            where.exe gemini | Tee-Object C:\probe\report.txt -Append
            RunTimed 'gemini --version' 30
            RunTimed 'gemini -p hello' 40
          } finally { Snap gemini }

      - name: OpenCode
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'; $PSNativeCommandUseErrorActionPreference = $false
          . C:\probe\helpers.ps1
          try {
            npm install -g opencode-ai 2>&1 | Select-Object -Last 2
            where.exe opencode | Tee-Object C:\probe\report.txt -Append
            RunTimed 'opencode --version' 30
            RunTimed 'opencode run hello' 45
            RunTimed 'opencode auth list' 30
          } finally { Snap opencode }

      - name: VS Code extension IDs and storage roots
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'; $PSNativeCommandUseErrorActionPreference = $false
          . C:\probe\helpers.ps1
          try {
            code --version | Select-Object -First 1
            foreach ($id in 'anthropic.claude-code','openai.chatgpt','github.copilot-chat','saoudrizwan.claude-dev','rooveterinaryinc.roo-cline') {
              $r = cmd /c "code --install-extension $id --force 2>&1" | Select-Object -Last 1
              "$id => $r" | Tee-Object C:\probe\report.txt -Append
            }
            $codeExe = Get-ChildItem 'C:\Program Files\Microsoft VS Code','C:\Users\runneradmin\AppData\Local\Programs\Microsoft VS Code' -Filter Code.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            "Code.exe => $($codeExe.FullName)" | Tee-Object C:\probe\report.txt -Append
            if ($codeExe) {
              Start-Process -FilePath $codeExe.FullName -ArgumentList '--disable-gpu','--new-window','C:\probe'
              Start-Sleep 60
              Get-Process Code -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            }
            "===== VS Code userData (%APPDATA%\Code\User, depth 2) =====" | Tee-Object C:\probe\report.txt -Append
            Get-ChildItem "$env:APPDATA\Code\User" -Recurse -Force -Depth 2 -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName } | Tee-Object C:\probe\report.txt -Append
            "===== installed extensions (%USERPROFILE%\.vscode\extensions) =====" | Tee-Object C:\probe\report.txt -Append
            Get-ChildItem "$env:USERPROFILE\.vscode\extensions" -Force -ErrorAction SilentlyContinue | ForEach-Object { $_.Name } | Tee-Object C:\probe\report.txt -Append
          } finally { Snap vscode }

      - name: Cursor
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'; $PSNativeCommandUseErrorActionPreference = $false
          . C:\probe\helpers.ps1
          try {
            winget install --id Anysphere.Cursor --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity 2>&1 | Select-Object -Last 2
            $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Depth 2 -Filter Cursor.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            "Cursor.exe => $($exe.FullName)" | Tee-Object C:\probe\report.txt -Append
            if ($exe) {
              Start-Process -FilePath $exe.FullName -ArgumentList '--disable-gpu','--new-window','C:\probe'
              Start-Sleep 75
              Get-Process Cursor -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            }
            "===== %APPDATA%\Cursor\User (depth 2) =====" | Tee-Object C:\probe\report.txt -Append
            Get-ChildItem "$env:APPDATA\Cursor\User" -Recurse -Force -Depth 2 -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName } | Tee-Object C:\probe\report.txt -Append
            "===== %USERPROFILE%\.cursor (depth 2) =====" | Tee-Object C:\probe\report.txt -Append
            Get-ChildItem "$env:USERPROFILE\.cursor" -Recurse -Force -Depth 2 -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName } | Tee-Object C:\probe\report.txt -Append
          } finally { Snap cursor }

      - name: Dump trees of everything the agents created
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = 'C:\probe\trees.txt'
          $roots = @(
            "$env:USERPROFILE\.copilot", "$env:USERPROFILE\.gemini", "$env:USERPROFILE\.local", "$env:USERPROFILE\.config",
            "$env:USERPROFILE\.cache", "$env:USERPROFILE\.cursor", "$env:USERPROFILE\.cline", "$env:USERPROFILE\.claude", "$env:USERPROFILE\.codex",
            "$env:LOCALAPPDATA\copilot", "$env:APPDATA\Cursor", "$env:APPDATA\Code\User", "$env:APPDATA\Claude", "$env:LOCALAPPDATA\opencode", "$env:APPDATA\opencode"
          )
          foreach ($r in $roots) {
            if (-not (Test-Path $r)) { "===== $r : ABSENT =====" | Tee-Object $out -Append; continue }
            "===== $r =====" | Tee-Object $out -Append
            Get-ChildItem $r -Recurse -Force -Depth 6 -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch '\\node_modules\\|\\pkg\\|\\extensions\\[^\\]+\\.+|\\Cache\\|\\CachedData\\|\\Code Cache\\|\\GPUCache\\|\\DawnCache|\\DawnGraphite|\\DawnWebGPU|\\blob_storage\\|\\Crashpad\\|\\Service Worker\\|\\Session Storage\\|\\Local Storage\\|\\IndexedDB\\|\\Shared Dictionary|\\CachedExtensionVSIXs|\\CachedProfilesData|\\repos\\.+|\\snapshot\\[^\\]+\\[^\\]+\\.+|\\history\\[^\\]+\\.+|\\bin\\' } |
              ForEach-Object { if ($_.PSIsContainer) { "$($_.FullName)\" } else { "$($_.FullName)  [$($_.Length)b]" } } | Tee-Object $out -Append
          }
          "===== %USERPROFILE%\.vscode\extensions (names) =====" | Tee-Object $out -Append
          Get-ChildItem "$env:USERPROFILE\.vscode\extensions" -Force -ErrorAction SilentlyContinue | ForEach-Object { $_.Name } | Tee-Object $out -Append
          "===== %USERPROFILE%\.cursor\extensions (names) =====" | Tee-Object $out -Append
          Get-ChildItem "$env:USERPROFILE\.cursor\extensions" -Force -ErrorAction SilentlyContinue | ForEach-Object { $_.Name } | Tee-Object $out -Append

      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-probe-report
          path: C:\probe
